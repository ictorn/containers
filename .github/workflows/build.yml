name: build images

on:
  push:
    branches: [ "main" ]
    tags-ignore: [ "*" ]

permissions:
  contents: read
  packages: write

jobs:
  nfs-server:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    name: build server image
    steps:
    - name: checkout repository
      uses: actions/checkout@v7
    - name: login to ghcr.io
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: build and push image
      uses: docker/build-push-action@v6
      with:
        context: ./nfs-server
        file: ./nfs-server/Containerfile
        push: true
        tags: ghcr.io/${{ github.repository_owner }}/nfs:server
